<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events in DOM</title>
</head>
<body>

    <h1>Events in DOM</h1>
    <p>In JavaScript, an event listener is a function that waits for a specific action to occur on a web page—such as a click, key press, or window resize—and then executes code in response</p>
    <button id="buttonClick">Click Me</button>

    <script>

        // Syntax for adding an event listener
        // element.addEventListener(type, listener)
        // element.addEventListener(type, listener, options)
        // element.addEventListener(type, listener, useCapture)

        // Example: Adding a click event listener to a button
        // Get the button element
        let button = document.getElementById('buttonClick');

        // Add an event Listener to the button
        button.addEventListener('click', function() {
            alert('Button was clicked!');
            console.log('Button was clicked!');
        })
    </script>
    
</body>
</html>
