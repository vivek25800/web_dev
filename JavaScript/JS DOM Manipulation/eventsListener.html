<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events in DOM</title>
</head>
<body>

    <h1>Events in DOM</h1>
    <p>In JavaScript, an event listener is a function that waits for a specific action to occur on a web page—such as a click, key press, or window resize—and then executes code in response</p>
    <button id="buttonClick">Show my Name</button>
    <h4 id="myName"></h4>

    <button id="anotherButton">Change the text</button>
    <p id="myText">Hello my name is Vivek!</p>

    <script src="eventListener.js"></script>
    
</body>
</html>
