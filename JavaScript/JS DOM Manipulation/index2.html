<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling with DOM Manipulation</title>
</head>
<body>

    <h3>Styling with JS DOM Manipulation</h3>

    <div id="fdiv" class="firstDiv" style="background-color: aqua; padding: 2rem;">
        First Div
        <p id="fpara" style="background-color: green; padding: 2rem;">First Para</p>

        <div id="sdiv" style="background-color: yellow; padding: 2rem;">
            Second Div
            <p id="spara" style="background-color: orange; padding: 2rem;">Second Para</p>
        </div>
    </div>

    <script>

        // Change first para background color
        let fParaElement = document.getElementById("fpara");
        console.log(fParaElement.style);
        fParaElement.style.backgroundColor = 'red';

        // Change second div background color
        let sDivElement = document.getElementById("sdiv");
        console.log(sDivElement);
        sDivElement.style.backgroundColor = 'green';

        // Change text of second para
        let sParaElement = document.getElementById("spara");
        sParaElement.textContent = "Third para";
        // change paragraph size
        sParaElement.style.fontSize = "24px";

        // Apply multiples inline style - cssText
        let fDivElement = document.getElementById("fdiv");
        console.log(fDivElement.style.cssText);
        fDivElement.style.cssText = "background-color: black; padding: 1rem; color: white;";

        // Assign attribute to element -  setAttribute
        sDivElement.setAttribute('class', "secondDiv");
        // styling
        sDivElement.setAttribute('style', 'padding: 2rem');

        // Change class name of element - className
        // Before change
        console.log(sDivElement.className); // secondDiv
        console.log(fDivElement.className); // firstDiv
        // After change
        fDivElement.className = "firstClass";
        sDivElement.classList = "secondClass";
        console.log(fDivElement.className); // firstClass
        console.log(sDivElement.className); // secondClass
        

    </script>
    
</body>
</html>
