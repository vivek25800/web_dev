<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling with DOM Manipulation</title>
</head>
<body>

    <h3>Styling with JS DOM Manipulation</h3>

    <div id="fdiv" class="firstDiv" style="background-color: aqua; padding: 2rem;">
        First Div
        <p id="fpara" style="background-color: green; padding: 2rem;">First Para</p>

        <div id="sdiv" style="background-color: yellow; padding: 2rem;">
            Second Div
            <p id="spara" style="background-color: orange; padding: 2rem;">Second Para</p>
        </div>
    </div>

    <script>

        // Change first para background color
        let fParaElement = document.getElementById("fpara");
        console.log(fParaElement.style);
        fParaElement.style.backgroundColor = 'red';

        // Change second div background color
        let sDivElement = document.getElementById("sdiv");
        console.log(sDivElement);
        sDivElement.style.backgroundColor = 'green';

        // Change text of second para
        let sParaElement = document.getElementById("spara");
        sParaElement.textContent = "Third para";
        // change paragraph size
        sParaElement.style.fontSize = "24px";

        // Apply multiples inline style - cssText
        let fDivElement = document.getElementById("fdiv");
        console.log(fDivElement.style.cssText);
        fDivElement.style.cssText = "background-color: black; padding: 1rem; color: white;";

        // Assign attribute to element -  setAttribute
        sDivElement.setAttribute('class', "secondDiv");
        // styling
        sDivElement.setAttribute('style', 'padding: 2rem');

        // Change class name of element - className
        // Before change
        console.log(sDivElement.className); // secondDiv
        console.log(fDivElement.className); // firstDiv
        // After change
        // fDivElement.className = "firstClass firstClass2"; // multiple class
        // sDivElement.classList = "secondClass";
        // console.log(fDivElement.className); // firstClass
        // console.log(sDivElement.className); // secondClass

        // Class list - classList
        console.log(fDivElement.classList); // DOMTokenList(2) ['firstDiv', 'firstClass2', value: 'firstDiv firstClass2']
        console.log(sDivElement.classList); // DOMTokenList ['secondDiv', value: 'secondDiv']
        // Add class
        fDivElement.classList.add('firstClass3');
        sDivElement.classList.add('secondClass2');
        console.log(fDivElement.classList); // DOMTokenList(3) ['firstDiv', 'firstClass2', 'firstClass3', value: 'firstDiv firstClass2 firstClass3']
        console.log(sDivElement.classList); // DOMTokenList(2) ['secondDiv', 'secondClass2', value: 'secondDiv secondClass2']
        // Remove class
        fDivElement.classList.remove('firstClass2');
        sDivElement.classList.remove('secondDiv');
        // Toggle class
        fDivElement.classList.toggle('firstClass2'); // add class if not exist or remove class if exist
        console.log(fDivElement.classList); // DOMTokenList(3) ['firstDiv', 'firstClass3', 'firstClass2', value: 'firstDiv firstClass3 firstClass2']
        sDivElement.classList.toggle('secondClassDiv'); // add class if not exist or remove class if exist
        console.log(sDivElement.classList); // DOMTokenList(3) ['secondClass2', 'secondClassDiv', value: 'secondClass2 secondClassDiv']
        // Check if class exist
        console.log(fDivElement.classList.contains('firstClass2')); // true
        console.log(sDivElement.classList.contains('secondClass')); // true

    </script>
    
</body>
</html>
